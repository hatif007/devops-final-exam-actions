name: flask-app
on:
  pull_request:
    branches:
      - dev 
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: download code flask
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14" 
      - name: Install dependencies
        run:  pip install -r requirements.txt 
      - name: Run tests 
        run:  python -m pytest tests/test_app.py -v
      - name: Run Flake8
        run:  python -m flake8 app.py tests/ 
        run:  flake8 --ignore=E302,E305,E303,E271,W292,W293