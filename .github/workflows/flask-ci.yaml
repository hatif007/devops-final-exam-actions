name: flask-app
on:
  pull_request:
    branches:
      - dev 
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: download code flask
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14" 
      - name: Install dependencies
        run:  pip install -r requirements.txt 
      - name: Run tests 
        run:  pytest  tests/test_app.py