name: flask-app
on:
  pull_request:
    branches:
      - dev 
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: download code flask
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14" 
      - name: Install dependencies
        run:  pip install -r requirements.txt 
  tests:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: download code flask
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"  
      - name: Run install 
        run:  pip install -r requirements.txt  
      - name: Run pytest 
        run:  python -m pytest tests/test_app.py -v  
  lint:  
    needs: install  
    runs-on: ubuntu-latest
    steps:
      - name: download code flask
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14" 
      - name: Run Flake8
        run:  pip install -r requirements.txt 
      - name: Test Flake8
        run:  python -m flake8 app.py tests/  --ignore=E302,E305,E303,E271,W292,W293