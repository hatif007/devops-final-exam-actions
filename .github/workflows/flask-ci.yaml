name: flask-app
on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
env:
  IMAGE_NAME:  hatif007/devops-final-exam
  IMAGE_TAG:  github-${{ github.run_number }}       
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: download code flask
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14" 
      - name: Install dependencies
        run:  pip install -r requirements.txt 
  tests:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: download code flask
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"  
      - name: Run install 
        run:  pip install -r requirements.txt  
      - name: Run pytest 
        run:  python -m pytest tests/test_app.py -v  
  lint:  
    needs: install  
    runs-on: ubuntu-latest
    steps:
      - name: download code flask
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14" 
      - name: Run Flake8
        run:  pip install -r requirements.txt 
      - name: Test Flake8
        run:  python -m flake8 app.py tests/  --ignore=E302,E305,E303,E271,W292,W293
  security:
    needs: install  
    runs-on: ubuntu-latest
    steps:
      - name: download code flask
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install bandit
        run:  pip install -r requirements.txt
      - name: Run bandit
        run:  python -m bandit -r app.py tests/ --severity-level high
  docker-build:
      needs: [security, lint, tests]
      runs-on: ubuntu-latest
      steps:
      - name: download code flask
        uses: actions/checkout@v7
      - name: image docker
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .
      - name: verify image
        run: docker image ls
      - name: image-inspect
        run: docker image inspect $IMAGE_NAME:$IMAGE_TAG
      - name: Save Docker
        run:  docker save -o flask-app.tar $IMAGE_NAME:$IMAGE_TAG
      - name:  Docker upload
        uses: actions/upload-artifact@v7
        with:
            name: my-artifact
            path: flask-app.tar
  trivy-scan:
     needs: docker-build
     runs-on: ubuntu-latest
     steps:
      - name: download code flask
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: my-artifact
      - name: Load Docker Image
        run:  docker load -i flask-app.tar
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH' 
      - name: login to docker hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v4
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}  
      - name: push Docker Image 
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run:  docker push $IMAGE_NAME:$IMAGE_TAG       
      - name: Show-GitHub-Run-Number
        run: 'echo "Build Number: github-${{ github.run_number }}"'


         





                        