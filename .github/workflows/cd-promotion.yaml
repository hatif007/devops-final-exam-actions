name: promotion
on:
  workflow_run:
    workflows: [flask-app]
    types:
      - completed
    branches:
      - dev      
   
jobs:
  promotion:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout_gitOps
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITOPS_TOKEN }}  
          repository: hatif007/devops-final-exam-gitops
          path: qa
          ref: main
      - name: Install yq
        run: |
         YQ_VERSION=v4.52.4
         sudo wget -q https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64 -O /usr/local/bin/yq
         sudo chmod +x /usr/local/bin/yq
         yq --version     
     
      - name: read and save 
        id: save_file
        run: echo "image_tag=$(yq '.pods.tag' qa/environments/dev/values.yaml)" >> "$GITHUB_OUTPUT"
      - name: what is the tag
        run: echo "${{ steps.save_file.outputs.image_tag }}"
      - name: read_and_save_tag_qa
        id: read_qa
        run: echo "image_tag=$(yq '.pods.tag' qa/environments/qa/values.yaml)" >> "$GITHUB_OUTPUT"
      - name: what is the tag
        run: echo "${{ steps.read_qa.outputs.image_tag }}"
      - name: gate_environments
        run: |
         DEV="${{ steps.save_file.outputs.image_tag }}"
         QA="${{ steps.read_qa.outputs.image_tag }}"
         if [ "$DEV" = "$QA" ]; then
          echo "Already up to date"
         else
          echo "Promotion required"
         fi
    outputs:  
      dev_tag: ${{ steps.save_file.outputs.image_tag }}   
  promote_qa:
    needs:  promotion
    runs-on: ubuntu-latest
    steps:
      - name: see the  version
        run: echo "Deploying ${{ needs.promotion.outputs.dev_tag }}"    
      - name: checkout_gitOps
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITOPS_TOKEN }}  
          repository: hatif007/devops-final-exam-gitops
          path: qa
          ref: main  
      - name: install_yq
        run: |
          YQ_VERSION=v4.52.4
          sudo wget -q https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: read current QA version
        run: yq '.pods.tag' qa/environments/qa/values.yaml
      
      - name: chance the qa file 
        env:
          DEV_TAG: ${{ needs.promotion.outputs.dev_tag }}
        id: tag_new  
        run:  yq -i '.pods.tag = strenv(DEV_TAG)' qa/environments/qa/values.yaml
      - name: show the tag name
        run: | 
          echo "the version is:"
          yq '.pods.tag' qa/environments/qa/values.yaml
      - name: Commit and add
        env:
          QA_TAG: ${{ needs.promotion.outputs.dev_tag }}
        working-directory: qa
        run: |
          git config user.name "hatif007"
          git config user.email "yoav.barel1@gmail.com"
          git add environments/qa/values.yaml
          git commit -m "Update QA image tag to $QA_TAG"
          git push origin main       
  promote_prd:
    needs:  promote_qa
    runs-on: ubuntu-latest
    outputs:
      PRD_TAG: ${{ steps.read_qa.outputs.image_tag }} 
    steps:
      - name: checkout_gitOps
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITOPS_TOKEN }}  
          repository: hatif007/devops-final-exam-gitops
          path: qa
          ref: main
      - name: Install yq
        run: |
         YQ_VERSION=v4.52.4
         sudo wget -q https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64 -O /usr/local/bin/yq
         sudo chmod +x /usr/local/bin/yq
         yq --version   
      - name: read_and_save_tag_qa
        id: read_qa
        run: echo "image_tag=$(yq '.pods.tag' qa/environments/qa/values.yaml)" >> "$GITHUB_OUTPUT"
      - name: what is the tag
        run: echo "${{ steps.read_qa.outputs.image_tag }}"
      - name: read current PRD version
        run: yq '.pods.tag' qa/environments/prd/values.yaml
      - name: chance the prd file 
        env:
          PRD_TAG: ${{ steps.read_qa.outputs.image_tag }}
        id: tag_new  
        run:  yq -i '.pods.tag = strenv(PRD_TAG)' qa/environments/prd/values.yaml
      - name: show the tag name
        run: | 
          echo "the version is:"
          yq '.pods.tag' qa/environments/prd/values.yaml  
      - name: Commit and add
        env:
          PRD_TAG: ${{ steps.read_qa.outputs.image_tag }}
          
        working-directory: qa
        run: |
          git config user.name "hatif007"
          git config user.email "yoav.barel1@gmail.com"
          git add environments/prd/values.yaml
          git commit -m "Update PRD image tag to $PRD_TAG"
          git push origin main     

  slackNotification:
    needs: [promotion, promote_qa, promote_prd]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: devops-final-exam-alerts
          SLACK_USERNAME: Yoav
          SLACK_TITLE: DevOps Final Exam - Promotion
          SLACK_COLOR: ${{ needs.promote_prd.result == 'success' && 'good' || 'danger' }}
          SLACK_MESSAGE: |
            Promotion: ${{ needs.promotion.result }}
            QA: ${{ needs.promote_qa.result }}
            PRD: ${{ needs.promote_prd.result }}
            Docker Image Tag: ${{ needs.promote_prd.outputs.prd_tag }}
          
